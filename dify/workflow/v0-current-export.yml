    - data:
        code: "function main(input) {\n  var raw = String((input && input.query) ||\
          \ \"\").trim();\n  var normalized = raw.toLowerCase();\n  var activeIntent\
          \ = String((input && input.active_intent) || \"\");\n  var pendingAction\
          \ = String((input && input.pending_action) || \"\");\n  var candidate =\
          \ String((input && input.case_id_candidate) || \"\");\n  var confirmed =\
          \ String((input && input.confirmed_case_id) || \"\");\n\n  var caseMatch\
          \ = raw.match(/(?:CASE-AA-\\d{4}|[AB]\\d{8}|ERR500|TIMEOUT)/i);\n  var ticketMatch\
          \ = raw.match(/(?:TK-\\d{8}-\\d{3}|T\\d{8})/i);\n  var extractedCase = caseMatch\
          \ ? caseMatch[0].toUpperCase() : \"\";\n  var extractedTicket = ticketMatch\
          \ ? ticketMatch[0].toUpperCase() : \"\";\n\n  var riskRules = [\n    { reason:\
          \ \"治疗异常\", words: [\"剧烈疼痛\",\"持续疼痛\",\"出血\",\"脸肿\",\"过敏\",\"吞下\",\"牙齿松动\"\
          ] },\n    { reason: \"个体临床决策\", words: [\"拔牙还是不拔牙\",\"多少量的ipr\",\"修改治疗方案\"\
          ,\"继续戴吗\"] },\n    { reason: \"投诉赔付\", words: [\"投诉\",\"赔付\",\"退款\",\"补偿\"\
          ,\"起诉\"] },\n    { reason: \"疗效责任\", words: [\"保证效果\",\"一定达到\",\"医生操作失误\"\
          ,\"谁负责\"] }\n  ];\n  var hits = [];\n  var riskHit = false;\n  var riskReason\
          \ = \"\";\n  for (var i = 0; i < riskRules.length; i++) {\n    var matched\
          \ = riskRules[i].words.filter(function(word){ return raw.indexOf(word) !==\
          \ -1; });\n    if (matched.length) {\n      riskHit = true;\n      riskReason\
